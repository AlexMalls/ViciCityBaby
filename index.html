<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vici City BABY!</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AlexMalls/ViciCityBaby/main/imagens/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      color: white;

      background-image:
        linear-gradient(rgba(18, 5, 35, 0.2), rgba(8, 2, 18, 0.3)),
        url('https://raw.githubusercontent.com/AlexMalls/ViciCityBaby/main/imagens/Background.png');

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;

      background:
        radial-gradient(circle at center,
          rgba(255, 70, 180, 0.18),
          transparent 55%),

        linear-gradient(to top,
          rgba(255, 120, 40, 0.18),
          transparent 35%),

        linear-gradient(to right,
          rgba(0, 238, 255, 0.08),
          transparent 40%);

      z-index: 1;
      
      filter: contrast(2) saturate(2);
     
    }

    .container {
      position: relative;
      z-index: 2;
      width: 95%;
      max-width: 1250px;
      text-align: center;
    }

    .top-icon {
      font-size: 3rem;
      color: #ff5fe1;
      margin-bottom: 10px;
      text-shadow: 0 0 18px #ff5fe1;
      display: flex;
      justify-content: center;
    }

    .subtitle {
      color: #7cecff;
      font-size: 1.2rem;
      letter-spacing: 5px;
      margin-bottom: 10px;
      text-transform: uppercase;
      text-shadow: 0 0 12px #7cecff;
      -webkit-text-stroke: 0.2px rgba(255,255,255,0.9);

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .subtitle::before,
    .subtitle::after {
      content: "";
      width: 100px;
      height: 2px;
      border-radius: 2px;
      position: relative;
    
      background: linear-gradient(90deg, #fd4fcb, #20adf9);
    }
    
    .subtitle::before::after,
    .subtitle::after::after {
      content: "";
      position: absolute;
      inset: 0;
    
      background: linear-gradient(90deg, #fd4fcb, #20adf9);
    
      filter: blur(8px);
      opacity: 0.9;
    }
    
    .title {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .gtasix {
      font-size: clamp(7rem, 14vw, 12rem);
      font-weight: 800;

      background: linear-gradient(
        135deg,
        #0fc7fd 15%,
        #0fc7fd 45%,
        #fd50ca 65%,
        #fd50ca 85%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
      
      -webkit-text-stroke: 2px rgba(255,255,255,0.9);

      text-shadow:
        0 0 10px rgba(253,79,203,0.4),
        0 0 25px rgba(32,173,249,0.4);
    }

    .date-box {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 30px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.15);
      background: rgba(30, 8, 48, 0.4);
      backdrop-filter: blur(10px);
      font-size: 1.6rem;
      margin-bottom: 14px;
      box-shadow: 0 0 20px rgba(255, 72, 212, 0.25);
      
      transform: translateY(-35px);
    }

    .timezone {
      color: rgba(255,255,255,0.85);
      margin-bottom: 40px;
      font-size: 1.3rem;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      margin-bottom: 45px;
    }

    .card {
      padding: 35px 20px;
      border-radius: 28px;
      background: rgba(22, 8, 38, 0.28);
      backdrop-filter: blur(14px);
      position: relative;
      overflow: hidden;
    }

    .card.blue {
      border: 2px solid rgba(108,249,251,0.8);
      box-shadow: 0 0 25px rgba(108,249,251,0.35);
    }

    .card.pink {
      border: 2px solid rgba(255,88,223,0.8);
      box-shadow: 0 0 25px rgba(255,88,223,0.35);
    }

    .number {
      font-size: clamp(6rem, 9vw, 8rem);
      font-weight: 800;
      margin-bottom: 10px;
      -webkit-text-stroke: 1.5px rgba(255,255,255,0.85);
    }
    
    .blue .number {
      background: linear-gradient(
        to bottom,
        #3394c6 0%,
        #76cffd 100%
      );
      
      text-shadow: 0 0 20px #3394c6;
    
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .pink .number {
      background: linear-gradient(
        to bottom,
        #9f1376 0%,
        #fd50ca 100%
      );
      
      text-shadow: 0 0 20px #fd50ca;
    
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .pink .number {
      color: #fd50ca;
      text-shadow: 0 0 20px #fd50ca;
    }

    .label {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .button {
      display: inline-block;
      padding: 18px 45px;
      border-radius: 50px;
      border: 2px solid rgba(255,255,255,0.18);
      background: rgba(40, 10, 50, 0.35);
      color: white;
      text-decoration: none;
      font-size: 1.4rem;
      font-weight: 600;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(255,88,223,0.25);
      transition: 0.3s ease;
    }

    .button:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 0 35px rgba(108,249,251,0.45);
    }

    .footer {
      position: absolute;
      bottom: 18px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 2;
      color: rgba(255,255,255,0.7);
      font-size: 1rem;
    }

    @media (max-width: 768px) {
      body {
        overflow-y: auto;
        padding: 30px 0;
      }

      .timezone {
        font-size: 1rem;
      }

      .date-box {
        font-size: 1rem;
        padding: 12px 18px;
      }

      .label {
        font-size: 1.2rem;
      }

      .button {
        font-size: 1rem;
      }

      .subtitle::before,
      .subtitle::after {
        width: 60px;
      }
    }
  
    /* Controle discreto do audio; o visual do contador permanece intacto */
    .music-panel {
      position: fixed; right: 20px; bottom: 18px; z-index: 100;
      display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
      max-width: min(340px, calc(100vw - 30px));
    }
    .music-button {
      padding: 12px 19px; border-radius: 28px; cursor: pointer;
      border: 1px solid #ff58df; color: #fff; font-family: inherit;
      font-size: 1.1rem; font-weight: 700; letter-spacing: .4px;
      background: rgba(32, 8, 47, .9);
      box-shadow: 0 0 20px rgba(255, 88, 223, .35);
    }
    .music-button:hover { box-shadow: 0 0 25px rgba(108, 249, 251, .55); }
    .music-status {
      color: #fff; font-size: .9rem; text-align: right; line-height: 1.25;
      text-shadow: 0 1px 4px #120623; background: rgba(15, 4, 28, .75);
      padding: 5px 9px; border-radius: 8px;
    }
    @media (max-width: 768px) {
      .music-panel { bottom: 12px; right: 12px; }
      .music-button { font-size: .95rem; padding: 10px 15px; }
    }

  </style>
</head>
<body>

  <div class="container">

    <div class="top-icon">
      <img src="https://raw.githubusercontent.com/AlexMalls/ViciCityBaby/main/imagens/Coqueiros%20-%20Neon%20Rosa.png" alt="Coqueiros Neon" style="height: 80px; width: auto; filter: drop-shadow(0 0 18px #ff5fe1);">
    </div>

    <div class="subtitle">CONTAGEM REGRESSIVA PARA</div>

    <div class="title">
      <div class="gtasix">GTA SIX</div>
    </div>

    <div class="date-box">
      19 DE NOVEMBRO DE 2026
    </div>

    <div class="countdown">

      <div class="card blue">
        <div class="number" id="days">0</div>
        <div class="label">Dias</div>
        <img src="https://raw.githubusercontent.com/AlexMalls/ViciCityBaby/main/imagens/Coqueiro%20-%20Neon%20Azul.png" alt="Coqueiro" style="height: 60px; width: auto; margin-top: 12px; filter: drop-shadow(0 0 10px #6cf9fb);">
      </div>

      <div class="card pink">
        <div class="number" id="hours">0</div>
        <div class="label">Horas</div>
        <img src="https://raw.githubusercontent.com/AlexMalls/ViciCityBaby/main/imagens/Flamingo%20-%20Neon%20Rosa.png" alt="Flamingo" style="height: 60px; width: auto; margin-top: 12px; filter: drop-shadow(0 0 10px #ff58df);">
      </div>

      <div class="card blue">
        <div class="number" id="minutes">0</div>
        <div class="label">Minutos</div>
        <img src="https://raw.githubusercontent.com/AlexMalls/ViciCityBaby/main/imagens/Onda%20-%20Neon%20Azul.png" alt="Onda" style="height: 60px; width: auto; margin-top: 12px; filter: drop-shadow(0 0 10px #6cf9fb);">
      </div>

      <div class="card pink">
        <div class="number" id="seconds">0</div>
        <div class="label">Segundos</div>
        <img src="https://raw.githubusercontent.com/AlexMalls/ViciCityBaby/main/imagens/Drink%20-%20Neon%20Rosa.png" alt="Drink" style="height: 60px; width: auto; margin-top: 12px; filter: drop-shadow(0 0 10px #ff58df);">
      </div>

    </div>

    <a class="button" href="https://www.rockstargames.com/VI">
      ✦ PREPARE-SE PARA VICE CITY
    </a>

  </div>
  

  <div class="music-panel" id="musicPanel">
    <button id="musicButton" class="music-button" type="button" aria-pressed="false">🔊 ATIVAR SOM</button>
    <div id="musicStatus" class="music-status" role="status" aria-live="polite">Som opcional — sincronizado com o horário de Brasília</div>
  </div>

  <script>
    const targetDate = new Date('2026-11-19T00:00:00-03:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        document.body.innerHTML = `
          <div style="
            height:100vh;
            width:100%;
            display:flex;
            justify-content:center;
            align-items:center;
            background:black;
            color:#ff58df;
            font-family:Inter,sans-serif;
            font-size:5rem;
            text-shadow:0 0 25px #ff58df;
          ">
            GTA SIX CHEGOU 🎉
          </div>
        `;
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = days;
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    // Teste: 18/11/2026 12:47. Virada final: 19/11/2026 00:00.
    // Em ambos, o trecho 05:39 da faixa coincide com o horario informado.
    const MUSIC_MOMENTS = [
      { label: 'teste 12:47', peak: new Date('2026-11-18T12:47:00-03:00').getTime() },
      { label: 'teste 12:55', peak: new Date('2026-11-18T12:55:00-03:00').getTime() },
      { label: 'virada 00:00', peak: new Date('2026-11-19T00:00:00-03:00').getTime() }
    ];
    const MUSIC_PEAK_SECONDS = 5 * 60 + 39;
    const MUSIC_LENGTH_SECONDS = 7 * 60 + 53;
    const MUSIC_URL = './Vici%20City%20is%20coming.mp3';
    const music = new Audio(MUSIC_URL);
    music.preload = 'auto';
    music.playsInline = true;
    const musicButton = document.getElementById('musicButton');
    const musicStatus = document.getElementById('musicStatus');
    let soundEnabled = false;
    let cachedAudioUrl = null;
    let isLoadingBlob = false;
    let playPending = false;
    let lastMusicError = '';

    function musicWindow() {
      const now = Date.now();
      const moment = MUSIC_MOMENTS.find(m =>
        now < m.peak + (MUSIC_LENGTH_SECONDS - MUSIC_PEAK_SECONDS) * 1000
      );
      if (!moment) return null;
      return { moment, position: (now - (moment.peak - MUSIC_PEAK_SECONDS * 1000)) / 1000 };
    }

    function musicPosition(pos) {
      if (music.readyState < 1) return;
      const limit = Number.isFinite(music.duration) && music.duration > 0
        ? Math.min(music.duration - .15, MUSIC_LENGTH_SECONDS - .15)
        : MUSIC_LENGTH_SECONDS - .15;
      const desired = Math.max(0, Math.min(pos, limit));
      if (Math.abs(music.currentTime - desired) > .3) {
        try { music.currentTime = desired; } catch (err) { /* aguardar metadados */ }
      }
    }

    function setMusicStatus(message) {
      if (musicStatus.textContent !== message) musicStatus.textContent = message;
    }

    function updateSoundButton() {
      musicButton.textContent = soundEnabled ? '🔇 DESATIVAR SOM' : '🔊 ATIVAR SOM';
      musicButton.setAttribute('aria-pressed', String(soundEnabled));
    }

    function tryPlayMusic() {
      if (!soundEnabled || !music.src || !music.paused || playPending) return;
      playPending = true;
      const request = music.play();
      if (request && typeof request.then === 'function') {
        request.then(() => { playPending = false; })
          .catch(() => {
            playPending = false;
            soundEnabled = false;
            updateSoundButton();
            setMusicStatus('Clique em ATIVAR SOM para liberar o áudio.');
          });
      } else {
        playPending = false;
      }
    }

    function syncMusic() {
      const current = musicWindow();
      if (!current) {
        music.pause();
        setMusicStatus('Eventos encerrados.');
        return;
      }

      const { moment, position } = current;
      if (position < 0) {
        if (!music.paused) music.pause();
        if (soundEnabled) setMusicStatus('Som preparado para ' + moment.label + '.');
        else setMusicStatus('Ative o som para acompanhar ' + moment.label + '.');
        return;
      }
      if (position >= MUSIC_LENGTH_SECONDS) {
        music.pause();
        return;
      }

      musicPosition(position);
      if (soundEnabled) {
        music.volume = 1;
        tryPlayMusic();
        if (!music.paused) {
          setMusicStatus('♪ ' + moment.label + ' — música sincronizada');
        }
      } else {
        if (!music.paused) music.pause();
        setMusicStatus('Clique em ATIVAR SOM para ouvir sincronizado.');
      }
    }

    // Armazena o MP3 completo em memoria para resistir a quedas da internet
    // depois de concluido o download. A URL original permite iniciar antes disso.
    async function preloadMusicOffline() {
      if (isLoadingBlob) return;
      isLoadingBlob = true;
      try {
        const response = await fetch(MUSIC_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const blob = await response.blob();
        if (blob.size < 1024) throw new Error('MP3 vazio ou incompleto');
        cachedAudioUrl = URL.createObjectURL(blob);
        const current = musicWindow();
        const wasPlaying = !music.paused;
        music.pause();
        music.src = cachedAudioUrl;
        music.load();
        if (current && current.position >= 0 && current.position < MUSIC_LENGTH_SECONDS) {
          musicPosition(current.position);
          if (wasPlaying && soundEnabled) tryPlayMusic();
        }
      } catch (error) {
        lastMusicError = error.message || 'Falha ao carregar MP3';
        setMusicStatus('Não foi possível carregar o MP3: ' + lastMusicError);
      } finally {
        isLoadingBlob = false;
      }
    }

    musicButton.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      updateSoundButton();
      if (!soundEnabled) {
        music.pause();
        setMusicStatus('Som desativado.');
        return;
      }
      const current = musicWindow();
      if (current && current.position >= 0 && current.position < MUSIC_LENGTH_SECONDS) {
        musicPosition(current.position);
        tryPlayMusic(); // Clique explícito autoriza a reprodução no navegador.
      } else {
        // Desbloqueia o áudio no gesto do usuário, antes do horário agendado.
        music.volume = 0;
        const permission = music.play();
        if (permission && typeof permission.then === 'function') {
          permission.then(() => {
            music.pause();
            music.volume = 1;
            syncMusic();
          }).catch(() => {
            music.volume = 1;
            setMusicStatus('Áudio não liberado. Clique novamente para tentar.');
          });
        }
      }
      syncMusic();
    });

    music.addEventListener('loadedmetadata', syncMusic);
    music.addEventListener('error', () => {
      if (music.error) setMusicStatus('MP3 indisponível. Confira o arquivo no GitHub.');
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) syncMusic();
    });
    window.addEventListener('focus', syncMusic);
    window.addEventListener('online', syncMusic);
    syncMusic();
    setInterval(syncMusic, 200);
    preloadMusicOffline();

  </script>

</body>
</html>
