<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vici City BABY!</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AlexMalls/ViciCityBaby/main/imagens/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      color: white;

      background-image:
        linear-gradient(rgba(18, 5, 35, 0.2), rgba(8, 2, 18, 0.3)),
        url('https://raw.githubusercontent.com/AlexMalls/ViciCityBaby/main/imagens/Background.png');

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;

      background:
        radial-gradient(circle at center,
          rgba(255, 70, 180, 0.18),
          transparent 55%),

        linear-gradient(to top,
          rgba(255, 120, 40, 0.18),
          transparent 35%),

        linear-gradient(to right,
          rgba(0, 238, 255, 0.08),
          transparent 40%);

      z-index: 1;
      
      filter: contrast(2) saturate(2);
     
    }

    .container {
      position: relative;
      z-index: 2;
      width: 95%;
      max-width: 1250px;
      text-align: center;
    }

    .top-icon {
      font-size: 3rem;
      color: #ff5fe1;
      margin-bottom: 10px;
      text-shadow: 0 0 18px #ff5fe1;
      display: flex;
      justify-content: center;
    }

    .subtitle {
      color: #7cecff;
      font-size: 1.2rem;
      letter-spacing: 5px;
      margin-bottom: 10px;
      text-transform: uppercase;
      text-shadow: 0 0 12px #7cecff;
      -webkit-text-stroke: 0.2px rgba(255,255,255,0.9);

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .subtitle::before,
    .subtitle::after {
      content: "";
      width: 100px;
      height: 2px;
      border-radius: 2px;
      position: relative;
    
      background: linear-gradient(90deg, #fd4fcb, #20adf9);
    }
    
    .subtitle::before::after,
    .subtitle::after::after {
      content: "";
      position: absolute;
      inset: 0;
    
      background: linear-gradient(90deg, #fd4fcb, #20adf9);
    
      filter: blur(8px);
      opacity: 0.9;
    }
    
    .title {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .gtasix {
      font-size: clamp(7rem, 14vw, 12rem);
      font-weight: 800;

      background: linear-gradient(
        135deg,
        #0fc7fd 15%,
        #0fc7fd 45%,
        #fd50ca 65%,
        #fd50ca 85%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
      
      -webkit-text-stroke: 2px rgba(255,255,255,0.9);

      text-shadow:
        0 0 10px rgba(253,79,203,0.4),
        0 0 25px rgba(32,173,249,0.4);
    }

    .date-box {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 30px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.15);
      background: rgba(30, 8, 48, 0.4);
      backdrop-filter: blur(10px);
      font-size: 1.6rem;
      margin-bottom: 14px;
      box-shadow: 0 0 20px rgba(255, 72, 212, 0.25);
      
      transform: translateY(-35px);
    }

    .timezone {
      color: rgba(255,255,255,0.85);
      margin-bottom: 40px;
      font-size: 1.3rem;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      margin-bottom: 45px;
    }

    .card {
      padding: 35px 20px;
      border-radius: 28px;
      background: rgba(22, 8, 38, 0.28);
      backdrop-filter: blur(14px);
      position: relative;
      overflow: hidden;
    }

    .card.blue {
      border: 2px solid rgba(108,249,251,0.8);
      box-shadow: 0 0 25px rgba(108,249,251,0.35);
    }

    .card.pink {
      border: 2px solid rgba(255,88,223,0.8);
      box-shadow: 0 0 25px rgba(255,88,223,0.35);
    }

    .number {
      font-size: clamp(6rem, 9vw, 8rem);
      font-weight: 800;
      margin-bottom: 10px;
      -webkit-text-stroke: 1.5px rgba(255,255,255,0.85);
    }
    
    .blue .number {
      background: linear-gradient(
        to bottom,
        #3394c6 0%,
        #76cffd 100%
      );
      
      text-shadow: 0 0 20px #3394c6;
    
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .pink .number {
      background: linear-gradient(
        to bottom,
        #9f1376 0%,
        #fd50ca 100%
      );
      
      text-shadow: 0 0 20px #fd50ca;
    
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .pink .number {
      color: #fd50ca;
      text-shadow: 0 0 20px #fd50ca;
    }

    .label {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .button {
      display: inline-block;
      padding: 18px 45px;
      border-radius: 50px;
      border: 2px solid rgba(255,255,255,0.18);
      background: rgba(40, 10, 50, 0.35);
      color: white;
      text-decoration: none;
      font-size: 1.4rem;
      font-weight: 600;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(255,88,223,0.25);
      transition: 0.3s ease;
    }

    .button:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 0 35px rgba(108,249,251,0.45);
    }

    .footer {
      position: absolute;
      bottom: 18px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 2;
      color: rgba(255,255,255,0.7);
      font-size: 1rem;
    }

    @media (max-width: 768px) {
      body {
        overflow-y: auto;
        padding: 30px 0;
      }

      .timezone {
        font-size: 1rem;
      }

      .date-box {
        font-size: 1rem;
        padding: 12px 18px;
      }

      .label {
        font-size: 1.2rem;
      }

      .button {
        font-size: 1rem;
      }

      .subtitle::before,
      .subtitle::after {
        width: 60px;
      }
    }
  

    /* Controle mínimo, em estilo de ícone do Windows. */
    .music-button {
      position: fixed; right: 18px; bottom: 18px; z-index: 1000;
      width: 38px; height: 38px; display: grid; place-items: center;
      padding: 5px; border: 0; border-radius: 8px;
      color: #fff; background: rgba(17, 9, 28, .25);
      cursor: pointer; transition: background .15s, color .15s;
    }
    .music-button:hover, .music-button:focus-visible {
      background: rgba(30, 13, 44, .75); outline-offset: 2px;
    }
    .music-button svg { width: 23px; height: 23px; }
    .music-button .sound-waves { display: none; }
    .music-button .sound-slash { display: block; }
    .music-button.sound-on .sound-waves { display: block; }
    .music-button.sound-on .sound-slash { display: none; }
    .launch-message[hidden] { display: none; }
    .launch-message {
      position: fixed; inset: 0; z-index: 3; display: grid;
      place-items: center; background: #000; color: #ff58df;
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(2.5rem, 7vw, 5rem);
      text-align: center; text-shadow: 0 0 25px #ff58df;
    }
    /* Evita cortar o botão inferior e deixa o conteúdo alinhado
       em telas comuns de notebook (área útil inferior a 850 px). */
    @media (max-height: 850px) and (min-width: 769px) {
      .top-icon { margin-bottom: 5px; }
      .top-icon img { height: 58px !important; }
      .subtitle { margin-bottom: 4px; }
      .title { margin-bottom: 7px; }
      .gtasix { font-size: clamp(6rem, 11vw, 9rem); }
      .date-box {
        transform: none; margin-bottom: 15px;
        font-size: 1.35rem; padding: 8px 23px;
      }
      .countdown { gap: 20px; margin-bottom: 20px; }
      .card { padding: 20px 16px; border-radius: 24px; }
      .number { font-size: clamp(4.7rem, 7vw, 6.5rem); margin-bottom: 5px; }
      .label { font-size: 1.6rem; }
      .card img { height: 48px !important; margin-top: 8px !important; }
      .button { padding: 12px 34px; font-size: 1.2rem; }
    }
    @media (max-width: 768px) {
      .music-button { right: 12px; bottom: 12px; }
    }


    /* Painel de diagnostico exclusivamente local: Shift + VICECITY. */
    #vcDebug[hidden] { display: none !important; }
    #vcDebug {
      position:fixed; z-index:9999; top:12px; right:12px;
      width:min(430px,calc(100vw - 24px)); max-height:calc(100dvh - 24px);
      overflow:auto; box-sizing:border-box; padding:12px 14px;
      font:500 12px/1.5 Consolas,ui-monospace,monospace; text-align:left;
      color:#eff1ff; background:rgba(12,8,26,.96);
      border:1px solid rgba(111,236,248,.7); border-radius:12px;
      box-shadow:0 9px 40px rgba(0,0,0,.65); backdrop-filter:blur(14px);
    }
    #vcDebug * { box-sizing:border-box; }
    .vc-debug-head { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .vc-debug-head strong { color:#7cecff; font-size:13px; letter-spacing:1px; }
    .vc-debug-close { color:white; background:rgba(255,255,255,.12); border:0; border-radius:6px; width:25px; height:25px; cursor:pointer; }
    .vc-debug-close:hover { background:rgba(255,88,223,.5); }
    #vcDebug section { padding-top:9px; margin-top:8px; border-top:1px solid rgba(255,255,255,.15); }
    #vcDebug h3 { color:#ff73db; font-size:11px; letter-spacing:.8px; margin:0 0 6px; }
    .vc-debug-line { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.35fr); gap:10px; padding:2px 0; align-items:baseline; }
    .vc-debug-line span { color:#abb3ce; }
    .vc-debug-line output { font:inherit; text-align:right; overflow-wrap:anywhere; color:#fff; }
    .vc-debug-note { font-size:10px; line-height:1.4; color:#9097b4; margin:12px 0 2px; }

  </style>
</head>
<body>

  <div class="container">

    <div class="top-icon">
      <img src="https://raw.githubusercontent.com/AlexMalls/ViciCityBaby/main/imagens/Coqueiros%20-%20Neon%20Rosa.png" alt="Coqueiros Neon" style="height: 80px; width: auto; filter: drop-shadow(0 0 18px #ff5fe1);">
    </div>

    <div class="subtitle">CONTAGEM REGRESSIVA PARA</div>

    <div class="title">
      <div class="gtasix">GTA SIX</div>
    </div>

    <div class="date-box">
      19 DE NOVEMBRO DE 2026
    </div>

    <div class="countdown">

      <div class="card blue">
        <div class="number" id="days">0</div>
        <div class="label">Dias</div>
        <img src="https://raw.githubusercontent.com/AlexMalls/ViciCityBaby/main/imagens/Coqueiro%20-%20Neon%20Azul.png" alt="Coqueiro" style="height: 60px; width: auto; margin-top: 12px; filter: drop-shadow(0 0 10px #6cf9fb);">
      </div>

      <div class="card pink">
        <div class="number" id="hours">0</div>
        <div class="label">Horas</div>
        <img src="https://raw.githubusercontent.com/AlexMalls/ViciCityBaby/main/imagens/Flamingo%20-%20Neon%20Rosa.png" alt="Flamingo" style="height: 60px; width: auto; margin-top: 12px; filter: drop-shadow(0 0 10px #ff58df);">
      </div>

      <div class="card blue">
        <div class="number" id="minutes">0</div>
        <div class="label">Minutos</div>
        <img src="https://raw.githubusercontent.com/AlexMalls/ViciCityBaby/main/imagens/Onda%20-%20Neon%20Azul.png" alt="Onda" style="height: 60px; width: auto; margin-top: 12px; filter: drop-shadow(0 0 10px #6cf9fb);">
      </div>

      <div class="card pink">
        <div class="number" id="seconds">0</div>
        <div class="label">Segundos</div>
        <img src="https://raw.githubusercontent.com/AlexMalls/ViciCityBaby/main/imagens/Drink%20-%20Neon%20Rosa.png" alt="Drink" style="height: 60px; width: auto; margin-top: 12px; filter: drop-shadow(0 0 10px #ff58df);">
      </div>

    </div>

    <a class="button" href="https://www.rockstargames.com/VI">
      ✦ PREPARE-SE PARA VICE CITY
    </a>

  </div>
  


  <button id="musicButton" class="music-button" type="button"
          aria-label="Ativar áudio" aria-pressed="false" title="Ativar áudio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
      <path d="M11 5 6 9H3v6h3l5 4V5Z" />
      <g class="sound-waves">
        <path d="M15 9a5 5 0 0 1 0 6" />
        <path d="M18 6a9 9 0 0 1 0 12" />
      </g>
      <g class="sound-slash"><path d="m16 9 5 6M21 9l-5 6" /></g>
    </svg>
  </button>
  <div class="launch-message" id="launchMessage" hidden>GTA SIX CHEGOU 🎉</div>


  <aside id="vcDebug" hidden aria-label="Painel de diagnostico Vici City">
    <div class="vc-debug-head">
      <strong>VICE CITY / LIVE DEBUG</strong>
      <button type="button" id="vcDebugClose" class="vc-debug-close" aria-label="Fechar painel de diagnostico">×</button>
    </div>
    <div id="vcDebugRows"></div>
    <p class="vc-debug-note">Horario local do dispositivo em Brasilia. Diagnostico somente neste navegador, sem IP. Shift + VICECITY alterna.</p>
  </aside>

  <script>
    // ===== CONFIGURACAO RAPIDA =====
    // Horario de Brasilia: 'HH:MM'. Use '' para desativar o teste.
    const horarioTeste = '14:53';
    // Ajuste em SEGUNDOS (pode ser decimal): + atrasa, - adianta.
    const Delay = 7;
    // Volume EXCLUSIVO do Synthwave (0 = mudo, 100 = maximo).
    const volumeSynthwave = 70;
    // ==============================

    const targetDate = new Date('2026-11-19T00:00:00-03:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        document.getElementById('launchMessage').hidden = false;
        document.querySelector('.container').style.display = 'none';
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = days;
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);


    // Teste no dia atual em Brasilia; virada oficial fixa em 19/11/2026.
    const MUSIC_MOMENTS = [
      { label: 'virada 00:00', peak: targetDate }
    ];

    function dataAtualBrasilia() {
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Sao_Paulo',
        year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(new Date());
      const read = type => parts.find(part => part.type === type).value;
      return read('year') + '-' + read('month') + '-' + read('day');
    }

    if (horarioTeste !== '') {
      if (/^([01]\d|2[0-3]):[0-5]\d$/.test(horarioTeste)) {
        const testTimestamp = new Date(
          dataAtualBrasilia() + 'T' + horarioTeste + ':00-03:00'
        ).getTime();
        MUSIC_MOMENTS.push({
          label: 'teste ' + horarioTeste,
          peak: testTimestamp
        });
      } else {
        console.warn('horarioTeste invalido: use HH:MM ou vazio para desativar.');
      }
    }
    MUSIC_MOMENTS.sort((a, b) => a.peak - b.peak);

    const MUSIC_PEAK_SECONDS = 5 * 60 + 39;
    const TIMING_CORRECTION_MS = Number.isFinite(Number(Delay)) ? Number(Delay) * 1000 : 0;
    const MUSIC_LENGTH_SECONDS = 7 * 60 + 53;
    const MUSIC_URL = './Vici%20City%20is%20coming.mp3';
    const musicButton = document.getElementById('musicButton');

    // Synthwave longo: reproduz por streaming, sem decodificar ~96 MB na memoria.
    // O relogio define o ponto do loop; reabrir o site nao reinicia a playlist.
    const AMBIENT_URL = './Synthwave%202000.mp3';
    const ambientAudio = new Audio(AMBIENT_URL);
    ambientAudio.volume = Math.max(0, Math.min(100, Number(volumeSynthwave))) / 100;
    ambientAudio.preload = 'auto';
    ambientAudio.loop = true;
    ambientAudio.playsInline = true;
    let ambientPlayPending = false;
    let ambientReady = false;
    // O mesmo evento determina a posicao do Synthwave e o inicio do Phil.
    // Enquanto um teste ainda nao terminou, ele substitui a referencia oficial.
    // Depois do teste, a referencia volta automaticamente para a meia-noite.
    function activeAudioTarget(now = Date.now()) {
      const trackLength = audioBuffer
        ? Math.min(audioBuffer.duration, MUSIC_LENGTH_SECONDS)
        : MUSIC_LENGTH_SECONDS;
      const event = MUSIC_MOMENTS.find(item =>
        now < item.peak + (trackLength - MUSIC_PEAK_SECONDS) * 1000 +
          TIMING_CORRECTION_MS
      );
      if (!event) return null;
      const startMs = event.peak - MUSIC_PEAK_SECONDS * 1000 + TIMING_CORRECTION_MS;
      return {
        event, startMs, endMs: startMs + trackLength * 1000, trackLength
      };
    }

    // Conta os loops de tras para frente, usando o inicio do Phil como marco fixo.
    let ambientResyncCount = 0;
    let ambientLastResync = 'nenhuma';
    let ambientLastDrift = null;
    function ambientPlan(now = Date.now()) {
      const target = activeAudioTarget(now);
      const secondsToFinal = target ? (target.startMs - now) / 1000 : null;
      const duration = ambientAudio.duration;
      if (!target || !Number.isFinite(duration) || duration <= 0)
        return { valid: false, target, duration: null, secondsToFinal };
      if (secondsToFinal <= 0)
        return { valid: true, target, duration, secondsToFinal, position: duration,
          remainingThisLoop: 0, completeLoopsAfter: 0, cycleFromEnd: 0,
          nextLoopMs: target.startMs };
      // Cada trecho atual somado aos ciclos seguintes termina exatamente no Phil.
      let position = ((-secondsToFinal % duration) + duration) % duration;
      if (duration - position < 0.00001) position = 0;
      const remainingThisLoop = position === 0 ? duration : duration - position;
      const completeLoopsAfter = Math.max(0,
        Math.round((secondsToFinal - remainingThisLoop) / duration));
      return {
        valid: true, target, duration, secondsToFinal, position, remainingThisLoop,
        completeLoopsAfter, cycleFromEnd: completeLoopsAfter + 1,
        nextLoopMs: now + remainingThisLoop * 1000
      };
    }

    function ambientShouldPlay() {
      const now = Date.now();
      const target = activeAudioTarget(now);
      // O teste e a virada usam a MESMA referencia do Phil Collins.
      return soundEnabled && Boolean(target) && now < target.startMs;
    }

    function syncAmbient(forceSeek = false) {
      if (!ambientShouldPlay()) {
        if (!ambientAudio.paused) ambientAudio.pause();
        return;
      }
      const plan = ambientPlan();
      if (plan.valid) {
        const difference = ambientAudio.currentTime - plan.position;
        const drift = ((difference + plan.duration / 2) %
          plan.duration + plan.duration) % plan.duration - plan.duration / 2;
        ambientLastDrift = drift;
        // Correcao fina na reta final. Durante o loop, evita saltos audiveis.
        const threshold = plan.secondsToFinal <= 20 ? 0.35 : 1.25;
        if (!ambientAudio.seeking &&
            ((forceSeek && Math.abs(drift) > 0.06) || Math.abs(drift) > threshold)) {
          try {
            ambientAudio.currentTime = plan.position;
            ambientResyncCount++;
            ambientLastResync = new Date().toLocaleTimeString('pt-BR',
              { timeZone: 'America/Sao_Paulo', hour12: false }) +
              ' | ' + drift.toFixed(3) + 's';
          } catch (error) { ambientLastResync = 'falha de busca: ' + error.message; }
        }
      }
      if (ambientAudio.paused && !ambientPlayPending) {
        ambientPlayPending = true;
        const promise = ambientAudio.play();
        if (promise && typeof promise.then === 'function') {
          promise.then(() => { ambientPlayPending = false; })
            .catch(error => {
              ambientPlayPending = false;
              ambientLastResync = 'play bloqueado: ' + (error.name || 'erro');
            });
        } else ambientPlayPending = false;
      }
    }

    ambientAudio.addEventListener('loadedmetadata', () => {
      ambientReady = true;
      syncAmbient(true);
    });
    ambientAudio.addEventListener('ended', () => {
      // O loop normalmente e automatico. Revalida a posicao pelo relogio.
      syncAmbient(true);
    });
    ambientAudio.addEventListener('error', () => {
      if (ambientAudio.error) console.warn('Synthwave indisponivel:', ambientAudio.error.code);
    });

    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioContext = null;
    let audioGain = null;
    let audioBuffer = null;
    let soundEnabled = false;
    let activeSource = null;
    let activeSchedule = null;
    let preloadError = null;

    let ambientCutoffGain = null;
    let ambientCutoffPlannedAt = 0;
    let ambientCutoffEventPeak = null;
    let ambientCutoffTime = null;

    if (AudioContextClass) {
      audioContext = new AudioContextClass({ latencyHint: 'interactive' });
      audioGain = audioContext.createGain();
      audioGain.gain.value = 0;
      audioGain.connect(audioContext.destination);
      // Mesmo AudioContext do Phil: ganho programado zera exatamente no inicio.
      try {
        const ambientSourceNode = audioContext.createMediaElementSource(ambientAudio);
        ambientCutoffGain = audioContext.createGain();
        ambientCutoffGain.gain.value = 1;
        ambientSourceNode.connect(ambientCutoffGain).connect(audioContext.destination);
      } catch (error) {
        console.warn('Corte preciso indisponivel; usando pausa programada:', error);
      }
    } else {
      musicButton.disabled = true;
      musicButton.title = 'Navegador não suporta Web Audio';
    }

    function musicWindow() {
      const now = Date.now();
      const target = activeAudioTarget(now);
      if (!target) return null;
      return {
        event: target.event, startMs: target.startMs, now,
        trackLength: target.trackLength,
        position: (now - target.startMs) / 1000
      };
    }

    function stopSource() {
      const old = activeSource;
      activeSource = null;
      activeSchedule = null;
      if (old) {
        old.onended = null;
        try { old.stop(); } catch (ignored) {}
        try { old.disconnect(); } catch (ignored) {}
      }
    }

    function scheduleSource(windowInfo) {
      if (!audioBuffer || !audioContext || !audioGain) return;
      stopSource();
      const { event, startMs, trackLength } = windowInfo;
      // Recalcular no último momento evita carregar atrasos acumulados.
      const now = Date.now();
      const position = (now - startMs) / 1000;
      if (position >= trackLength || position >= audioBuffer.duration) return;
      const delay = Math.max(0, -position);
      const offset = Math.max(0, position);
      const source = audioContext.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioGain);
      const startClock = audioContext.currentTime + delay;
      activeSource = source;
      activeSchedule = { peak: event.peak, startMs, startClock, offset };
      source.onended = () => {
        if (activeSource === source) {
          activeSource = null;
          activeSchedule = null;
        }
      };
      // O Web Audio agenda o instante de inicio na linha de tempo de audio,
      // sem depender de disparos de setInterval ou espera por seek do MP3.
      source.start(startClock, offset);
    }

    function syncMusic(forceReschedule = false) {
      if (!audioContext || !audioBuffer) return;
      const current = musicWindow();
      if (!current || current.position >= current.trackLength) {
        stopSource();
        return;
      }
      if (!soundEnabled || audioContext.state !== 'running') return;

      if (!activeSource || !activeSchedule ||
          activeSchedule.peak !== current.event.peak || forceReschedule) {
        scheduleSource(current);
        return;
      }

      const scheduled = activeSchedule;
      const expectedPosition = current.position;
      const actualPosition = scheduled.offset +
        (audioContext.currentTime - scheduled.startClock);

      // Com a faixa ainda agendada, comparar os tempos restantes.
      // Ja tocando, comparar a posição musical real com o relogio.
      const timingError = expectedPosition < 0
        ? (scheduled.startClock - audioContext.currentTime) +
          expectedPosition
        : actualPosition - expectedPosition;
      if (Math.abs(timingError) > 0.22) {
        scheduleSource(current);
      }
    }

    function scheduleAmbientCutoff() {
      if (!ambientCutoffGain || !audioContext || audioContext.state !== 'running') return;
      const now = Date.now();
      const target = activeAudioTarget(now);
      const currentTime = audioContext.currentTime;
      const seconds = target ? (target.startMs - now) / 1000 : -1;
      // Atualizar o alvo tambem reativa a saida depois de um teste encerrado.
      ambientCutoffGain.gain.cancelScheduledValues(currentTime);
      ambientCutoffGain.gain.setValueAtTime(seconds > 0 ? 1 : 0, currentTime);
      if (seconds > 0)
        ambientCutoffGain.gain.setValueAtTime(0, currentTime + seconds);
      ambientCutoffPlannedAt = now;
      ambientCutoffEventPeak = target ? target.event.peak : null;
      ambientCutoffTime = target ? target.startMs : null;
    }

    function setSoundEnabled(enabled) {
      soundEnabled = enabled;
      musicButton.classList.toggle('sound-on', enabled);
      const action = enabled ? 'Silenciar áudio' : 'Ativar áudio';
      musicButton.setAttribute('aria-label', action);
      musicButton.setAttribute('aria-pressed', String(enabled));
      musicButton.title = action;
      if (audioGain && audioContext) {
        audioGain.gain.setValueAtTime(enabled ? 1 : 0, audioContext.currentTime);
      }
    }

    musicButton.addEventListener('click', () => {
      const next = !soundEnabled;
      setSoundEnabled(next);
      if (!next) {
        ambientAudio.pause();
        return;
      }

      // play() e chamado durante o clique para liberar o MP3 no navegador.
      syncAmbient(true);
      if (!audioContext) return;
      audioContext.resume()
        .then(() => {
          syncMusic(true);
          scheduleAmbientCutoff();
          syncAmbient();
        })
        .catch(() => {
          setSoundEnabled(false);
          ambientAudio.pause();
          musicButton.title = 'Clique novamente para liberar áudio';
        });
    });

    // Primeiro transfere e decodifica a faixa inteira, UMA vez.
    // Não substitui o arquivo de uma música já tocando, nem reseta seu ponto.
    async function preloadMusic() {
      if (!audioContext) return;
      try {
        const response = await fetch(MUSIC_URL, { cache: 'force-cache' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const bytes = await response.arrayBuffer();
        if (bytes.byteLength < 100000) throw new Error('Arquivo MP3 vazio');
        audioBuffer = await audioContext.decodeAudioData(bytes);
        if (!audioBuffer || audioBuffer.duration <= MUSIC_PEAK_SECONDS) {
          throw new Error('MP3 muito curto ou invalido');
        }
        syncMusic(true);
      } catch (error) {
        preloadError = error;
        musicButton.title = 'Falha ao carregar MP3: ' + error.message;
      }
    }

    function syncAll() {
      const selected = activeAudioTarget();
      const selectedPeak = selected ? selected.event.peak : null;
      // Reagendar IMEDIATAMENTE ao sair do teste para a virada oficial.
      if (audioContext && audioContext.state === 'running' &&
          (Date.now() - ambientCutoffPlannedAt > 3000 ||
           ambientCutoffEventPeak !== selectedPeak)) scheduleAmbientCutoff();
      syncAmbient();
      syncMusic();
      if (typeof renderViciDebug === 'function') renderViciDebug();
    }
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        scheduleAmbientCutoff(); syncAmbient(true); syncMusic();
      }
    });
    window.addEventListener('pageshow', () => {
      scheduleAmbientCutoff(); syncAmbient(true); syncMusic();
    });
    window.addEventListener('focus', () => {
      scheduleAmbientCutoff(); syncAmbient(true); syncMusic();
    });
    window.addEventListener('online', syncAll);

    // Atalho: segurar Shift e digitar V I C E C I T Y, nesta ordem.
    // Persistencia por perfil de navegador via localStorage, nao por IP.
    const vcDebugPanel = document.getElementById('vcDebug');
    const vcDebugRows = document.getElementById('vcDebugRows');
    const vcDebugStore = 'viciCity.debugVisible';
    const vcDebugSchema = [
      ['RELOGIO / TRANSICAO', [
        ['clock','Agora em Brasilia'],['phase','Etapa musical'],
        ['activeEvent','Referencia ativa'],
        ['finalAt','Phil começa (ativo)'],['untilFinal','Falta para o Phil'],
        ['peakAt','Apice ativo'],['untilPeak','Falta para o apice'],
        ['officialPeak','Virada oficial'],['officialRemain','Falta para a virada'],
        ['test','Teste / Delay']]],
      ['SYNTHWAVE - LOOPS REVERSOS', [
        ['duration','Duração real MP3'],['position','Posição calculada'],
        ['actual','Posição real'],['loopRemaining','Falta neste ciclo'],
        ['fullLoops','Loops completos restantes'],['cycleNumber','Ciclo contado de trás'],
        ['nextLoop','Próximo fim de loop'],['drift','Desvio real vs ideal'],
        ['corrections','Correções realizadas'],['lastCorrection','Última correção']]],
      ['PLAYER / CARREGAMENTO', [
        ['volume','Volume / mute'],['synthStatus','Situação do Synthwave'],
        ['buffer','Buffer disponível'],['philStatus','Situação do Phil'],
        ['philPosition','Posição do Phil'],['philDrift','Desvio estimado Phil'],
        ['context','Estado AudioContext'],['cutoff','Corte programado'],
        ['network','Conexão']]]
    ];
    for (const [heading, fields] of vcDebugSchema) {
      const section = document.createElement('section');
      const h3 = document.createElement('h3');
      h3.textContent = heading;
      section.appendChild(h3);
      for (const [field, label] of fields) {
        const row = document.createElement('div');
        row.className = 'vc-debug-line';
        const caption = document.createElement('span');
        caption.textContent = label;
        const output = document.createElement('output');
        output.id = 'vcd-' + field;
        output.textContent = '—';
        row.append(caption,output);
        section.appendChild(row);
      }
      vcDebugRows.appendChild(section);
    }
    const vcOutputs = Object.fromEntries([...vcDebugRows.querySelectorAll('output')]
      .map(output => [output.id.slice(4), output]));
    let vcDebugVisible = false;
    function setVcDebug(visible) {
      vcDebugVisible = Boolean(visible);
      vcDebugPanel.hidden = !vcDebugVisible;
      try { localStorage.setItem(vcDebugStore, vcDebugVisible ? '1' : '0'); }
      catch (ignored) {}
      // Agenda a leitura apos a inicializacao dos formatadores de data.
      if (vcDebugVisible) setTimeout(renderViciDebug, 0);
    }
    try { setVcDebug(localStorage.getItem(vcDebugStore) === '1'); }
    catch (ignored) { setVcDebug(false); }
    document.getElementById('vcDebugClose').addEventListener('click', () => setVcDebug(false));
    const vcSequence = 'VICECITY';
    let vcTyped = '';
    document.addEventListener('keydown', event => {
      if (event.repeat || event.key === 'Shift') return;
      if (!event.shiftKey || event.altKey || event.ctrlKey || event.metaKey) {
        vcTyped = ''; return;
      }
      const key = event.key.toUpperCase();
      if (!/^[A-Z]$/.test(key)) { vcTyped = ''; return; }
      const attempt = vcTyped + key;
      vcTyped = vcSequence.startsWith(attempt) ? attempt : (key === 'V' ? 'V' : '');
      if (vcTyped === vcSequence) {
        vcTyped = '';
        setVcDebug(!vcDebugVisible);
      }
    });

    const vcFullClock = new Intl.DateTimeFormat('pt-BR',{
      timeZone:'America/Sao_Paulo', year:'numeric',month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
    });
    const vcTime = new Intl.DateTimeFormat('pt-BR',{
      timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
    });
    const vcClock = ms => vcFullClock.format(new Date(ms));
    const vcDuration = seconds => {
      if (!Number.isFinite(seconds)) return 'aguardando metadados';
      const v = Math.max(0,seconds), hrs=Math.floor(v/3600),
        min=Math.floor(v%3600/60), sec=(v%60).toFixed(2).padStart(5,'0');
      return (hrs?hrs+'h ':'')+String(min).padStart(2,'0')+'m '+sec+'s';
    };
    const vcUntil = seconds => seconds < 0 ?
      'passou há '+vcDuration(-seconds) : vcDuration(seconds);
    function vcBuffered() {
      try {
        for (let i=0;i<ambientAudio.buffered.length;i++) {
          if (ambientAudio.buffered.start(i)<=ambientAudio.currentTime &&
              ambientAudio.buffered.end(i)>=ambientAudio.currentTime)
            return vcDuration(ambientAudio.buffered.end(i)-ambientAudio.currentTime)+' à frente';
        }
      } catch (ignored) {}
      return 'sem buffer no ponto atual';
    }
    function renderViciDebug() {
      if (!vcDebugVisible) return;
      const now=Date.now(), plan=ambientPlan(now), phil=musicWindow(),
        selected=activeAudioTarget(now),
        left=selected ? (selected.startMs-now)/1000 : null;
      const inPhil=Boolean(phil && phil.position>=0 && phil.position<phil.trackLength);
      let philDrift='sem reprodução';
      if (activeSchedule && audioContext && audioContext.state==='running') {
        const real=activeSchedule.offset+audioContext.currentTime-activeSchedule.startClock;
        philDrift=((real-(now-activeSchedule.startMs)/1000)*1000).toFixed(0)+'ms estimado';
      }
      const ready=['sem dados','metadados','trecho atual','mais dados','pronto'];
      const network=['vazio','parado','baixando','sem origem'];
      const metrics={
        clock:vcClock(now),
        phase:inPhil?'PHIL COLLINS':selected ?
          (soundEnabled?'SYNTHWAVE':'SYNTHWAVE (MUDO)') : 'FINAL / ENCERRADO',
        activeEvent:selected ? selected.event.label : 'nenhum evento futuro',
        finalAt:selected ? vcClock(selected.startMs) : '—',
        untilFinal:selected ? vcUntil(left) : '—',
        peakAt:selected ? vcClock(selected.event.peak) : '—',
        untilPeak:selected ? vcUntil((selected.event.peak-now)/1000) : '—',
        officialPeak:vcClock(targetDate),
        officialRemain:vcUntil((targetDate-now)/1000),
        test:(horarioTeste||'desativado')+' / '+Delay+'s',
        duration:plan.valid?vcDuration(plan.duration):'carregando metadados',
        position:plan.valid&&left>0?vcDuration(plan.position):'—',
        actual:ambientReady?vcDuration(ambientAudio.currentTime):'aguardando',
        loopRemaining:plan.valid&&left>0?vcDuration(plan.remainingThisLoop):'—',
        fullLoops:plan.valid&&left>0?String(plan.completeLoopsAfter):'—',
        cycleNumber:plan.valid&&left>0?String(plan.cycleFromEnd)+'º contado do fim':'—',
        nextLoop:plan.valid&&left>0?vcClock(Math.min(plan.nextLoopMs,selected.startMs)):'—',
        drift:Number.isFinite(ambientLastDrift)?
          (ambientLastDrift>0?'+':'')+ambientLastDrift.toFixed(3)+'s':'aguardando',
        corrections:ambientResyncCount+' seeks',
        lastCorrection:ambientLastResync,
        volume:(soundEnabled?'som ligado':'mudo')+' | Synth '+volumeSynthwave+'% / Phil 100%',
        synthStatus:(ambientAudio.paused?'pausado':'tocando')+
          (ambientAudio.seeking?' / buscando':'')+
          ' / '+(ready[ambientAudio.readyState]||'?')+
          ' / '+(network[ambientAudio.networkState]||'?'),
        buffer:vcBuffered(),
        philStatus:audioBuffer?'pronto ('+vcDuration(audioBuffer.duration)+')':
          (preloadError?'erro: '+preloadError.message:'baixando / decodificando'),
        philPosition:phil&&phil.position>=0?vcDuration(phil.position):'aguardando',
        philDrift,
        context:audioContext?(audioContext.state+
          (Number.isFinite(audioContext.baseLatency)?
          ' / latência '+Math.round(audioContext.baseLatency*1000)+'ms':'')):'indisponível',
        cutoff:ambientCutoffGain&&ambientCutoffPlannedAt&&ambientCutoffTime!==null?
          vcTime.format(new Date(ambientCutoffTime))+
          ' ('+(selected?selected.event.label:'sem alvo')+')':'aguardando som',
        network:navigator.onLine?'online / relógio local':'offline / relógio local'
      };
      for (const [field,value] of Object.entries(metrics)) {
        if (vcOutputs[field]) vcOutputs[field].textContent=value;
      }
    }

    setInterval(syncAll, 200);
    // Os dois carregamentos sao independentes: o mashup faz streaming;
    // a faixa final curta continua pre-decodificada com agendamento preciso.
    preloadMusic();
    ambientAudio.load();

  </script>

</body>
</html>
